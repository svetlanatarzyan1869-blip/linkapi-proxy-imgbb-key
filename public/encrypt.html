<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шифратор ключей для Tavo Proxy</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 1rem; background: #f5f5f7; }
        .container { background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #ccc; border-radius: 0.5rem; box-sizing: border-box; }
        button.encrypt-btn { margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #0070f3; color: white; border: none; border-radius: 0.5rem; cursor: pointer; width: 100%; font-size: 1rem; }
        button.encrypt-btn:hover { background: #005bb5; }
        .result { margin-top: 1.5rem; background: #f0f0f0; padding: 1rem; border-radius: 0.5rem; word-break: break-all; }
        .error { color: red; margin-top: 0.5rem; }

        /* Вкладки */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .tab { flex: 1; padding: 0.6rem 1rem; border: 2px solid #ddd; border-radius: 0.5rem; cursor: pointer; background: #f5f5f7; font-weight: 600; font-size: 0.95rem; text-align: center; transition: all 0.2s; }
        .tab.active { background: #0070f3; color: white; border-color: #0070f3; }
        .tab:hover:not(.active) { border-color: #0070f3; color: #0070f3; }

        .panel { display: none; }
        .panel.active { display: block; }

        .badge { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 0.3rem; margin-left: 0.5rem; vertical-align: middle; }
        .badge-link { background: #e8f4fd; color: #0070f3; }
        .badge-rift { background: #f0e8fd; color: #7c3aed; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔐 Шифратор API-ключей</h1>
    <p>Введите свои ключи — мастер-ключ уже встроен.</p>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('link')">🔗 LinkAPI <span class="badge badge-link">Link</span></div>
        <div class="tab" onclick="switchTab('rift')">🌀 RiftAI <span class="badge badge-rift">Rift</span></div>
    </div>

    <!-- Link панель -->
    <div class="panel active" id="panel-link">
        <label>🔑 API_KEY (LinkAPI)</label>
        <input type="text" id="link-apiKey" placeholder="sk-...">

        <label>🖼️ IMGBB_KEY (обязательно)</label>
        <input type="text" id="link-imgbbKey" placeholder="ваш_ключ_ImgBB">

        <button class="encrypt-btn" onclick="encrypt('link')">Зашифровать → получить data</button>

        <div id="link-result" class="result" style="display:none;">
            <strong>Ваша строка data для LinkAPI (скопируйте):</strong><br>
            <span id="link-encryptedData"></span>
            <br>
            <button onclick="copyResult('link')" style="margin-top:0.5rem; padding:0.4rem 1rem; background:#28a745; color:white; border:none; border-radius:0.5rem; cursor:pointer;">Копировать</button>
        </div>
        <div id="link-error" class="error"></div>
    </div>

    <!-- RiftAI панель -->
    <div class="panel" id="panel-rift">
        <label>🔑 API_KEY (RiftAI)</label>
        <input type="text" id="rift-apiKey" placeholder="sk-riftai-...">

        <label>🖼️ IMGBB_KEY (обязательно)</label>
        <input type="text" id="rift-imgbbKey" placeholder="ваш_ключ_ImgBB">

        <button class="encrypt-btn" onclick="encrypt('rift')" style="background:#7c3aed;">Зашифровать → получить data</button>

        <div id="rift-result" class="result" style="display:none;">
            <strong>Ваша строка data для RiftAI (скопируйте):</strong><br>
            <span id="rift-encryptedData"></span>
            <br>
            <button onclick="copyResult('rift')" style="margin-top:0.5rem; padding:0.4rem 1rem; background:#28a745; color:white; border:none; border-radius:0.5rem; cursor:pointer;">Копировать</button>
        </div>
        <div id="rift-error" class="error"></div>
    </div>
</div>

<script>
    const MASTER_KEY = 'DNuPiIbKpNyB8M/h9wZX3I9XqMF0BMORS63wd8RvWKs=';

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab:nth-child(${tab === 'link' ? 1 : 2})`).classList.add('active');
        document.getElementById(`panel-${tab}`).classList.add('active');
    }

    async function encryptData(obj, secretKeyBase64) {
        const encoder = new TextEncoder();
        const data = encoder.encode(JSON.stringify(obj));
        const iv = crypto.getRandomValues(new Uint8Array(16));
        const keyBuffer = Uint8Array.from(atob(secretKeyBase64), c => c.charCodeAt(0));
        const cryptoKey = await crypto.subtle.importKey('raw', keyBuffer, 'AES-CBC', false, ['encrypt']);
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-CBC', iv }, cryptoKey, data);
        const ivBase64 = btoa(String.fromCharCode(...iv));
        const encryptedBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));
        return `${ivBase64}:${encryptedBase64}`;
    }

    async function encrypt(provider) {
        const apiKey = document.getElementById(`${provider}-apiKey`).value.trim();
        const imgbbKey = document.getElementById(`${provider}-imgbbKey`).value.trim();
        const errorDiv = document.getElementById(`${provider}-error`);
        const resultDiv = document.getElementById(`${provider}-result`);

        errorDiv.innerText = '';
        resultDiv.style.display = 'none';

        if (!apiKey || !imgbbKey) {
            errorDiv.innerText = 'Заполните оба поля.';
            return;
        }

        try {
            const encrypted = await encryptData({ key: apiKey, imgbb_key: imgbbKey }, MASTER_KEY);
            document.getElementById(`${provider}-encryptedData`).innerText = encrypted;
            resultDiv.style.display = 'block';
        } catch (err) {
            errorDiv.innerText = 'Ошибка: ' + err.message;
        }
    }

    function copyResult(provider) {
        const text = document.getElementById(`${provider}-encryptedData`).innerText;
        navigator.clipboard.writeText(text).then(() => alert('Скопировано!'));
    }
</script>
</body>
</html>
